{% extends "customer_app/base.html" %}
{% load static %}

{% block content %}
<div class="shop-layout" style="grid-template-columns: 2fr 1fr; margin-top: 8rem; max-width: 1200px;">
    
    <!-- Checkout Form -->
    <div class="shop-main" style="background: var(--bg-surface); border: 1px solid var(--card-border); border-radius: 16px; padding: 2rem;">
        <h2 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 2rem; border-bottom: 1px solid var(--card-border); padding-bottom: 1rem;">Billing Details</h2>
        
        <form style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
            <div style="grid-column: 1 / span 2;">
                <label style="display: block; color: var(--text-secondary); margin-bottom: 0.5rem;">Full Name</label>
                <input type="text" placeholder="John Doe" style="width: 100%; padding: 0.8rem; border-radius: 8px; border: 1px solid var(--card-border); background: rgba(255,255,255,0.02); color: white;">
            </div>
            
            <div style="grid-column: 1 / span 2;">
                <label style="display: block; color: var(--text-secondary); margin-bottom: 0.5rem;">Email Address</label>
                <input type="email" placeholder="john@example.com" style="width: 100%; padding: 0.8rem; border-radius: 8px; border: 1px solid var(--card-border); background: rgba(255,255,255,0.02); color: white;">
            </div>

            <div style="grid-column: 1 / span 2;">
                <label style="display: block; color: var(--text-secondary); margin-bottom: 0.5rem;">Shipping Address</label>
                <input type="text" placeholder="123 Gaming Street" style="width: 100%; padding: 0.8rem; border-radius: 8px; border: 1px solid var(--card-border); background: rgba(255,255,255,0.02); color: white;">
            </div>

            <div>
                <label style="display: block; color: var(--text-secondary); margin-bottom: 0.5rem;">City</label>
                <input type="text" placeholder="New York" style="width: 100%; padding: 0.8rem; border-radius: 8px; border: 1px solid var(--card-border); background: rgba(255,255,255,0.02); color: white;">
            </div>
            <div>
                <label style="display: block; color: var(--text-secondary); margin-bottom: 0.5rem;">Zip / Postcode</label>
                <input type="text" placeholder="10001" style="width: 100%; padding: 0.8rem; border-radius: 8px; border: 1px solid var(--card-border); background: rgba(255,255,255,0.02); color: white;">
            </div>

            <div style="grid-column: 1 / span 2; margin-top: 1.5rem; border-top: 1px solid var(--card-border); padding-top: 1.5rem;">
                <h3 style="font-size: 1.2rem; font-weight: 600; margin-bottom: 1rem;">Payment Method</h3>
                <div style="display: flex; gap: 1rem;">
                    <label style="padding: 1rem; border: 1px solid var(--accent-color); border-radius: 8px; background: rgba(99,102,241,0.1); flex: 1; text-align: center; cursor: pointer; color: white;">
                        <input type="radio" name="payment" checked style="margin-right: 0.5rem;"> Credit Card
                    </label>
                    <label style="padding: 1rem; border: 1px solid var(--card-border); border-radius: 8px; background: rgba(255,255,255,0.02); flex: 1; text-align: center; cursor: pointer; color: var(--text-secondary);">
                        <input type="radio" name="payment" style="margin-right: 0.5rem;"> PayPal
                    </label>
                </div>
            </div>
            
            <div style="grid-column: 1 / span 2; margin-top: 1rem;">
                <button type="submit" class="btn-premium" style="width: 100%; padding: 1rem; justify-content: center;">Complete Purchase</button>
            </div>
        </form>
    </div>

    <!-- Order Summary -->
    <div style="background: rgba(0,0,0,0.2); border: 1px solid var(--card-border); border-radius: 16px; padding: 2rem; height: fit-content; position: sticky; top: 100px;">
        <h3 style="font-size: 1.2rem; font-weight: 600; margin-bottom: 1.5rem; border-bottom: 1px solid var(--card-border); padding-bottom: 1rem;">Order Summary</h3>
        
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; font-size: 0.95rem;">
            <div style="display: flex; gap: 0.5rem; color: var(--text-secondary);">
                <span>1x</span>
                <span style="color: white; font-weight: 500;">Premium Keyboard</span>
            </div>
            <span>$150.00</span>
        </div>
        
        <div style="border-top: 1px solid var(--card-border); padding-top: 1.5rem; margin-top: 1rem;">
            <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem; color: var(--text-secondary);">
                <span>Subtotal</span>
                <span>$150.00</span>
            </div>
            <div style="display: flex; justify-content: space-between; margin-bottom: 1.5rem; color: var(--text-secondary);">
                <span>Shipping</span>
                <span>Free</span>
            </div>
            <div style="display: flex; justify-content: space-between; font-size: 1.3rem; font-weight: 700; color: white;">
                <span>Total</span>
                <span style="color: var(--accent-color);">$150.00</span>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% extends "customer_app/base.html" %}
{% load static %}

{% block content %}
<div class="shop-layout" style="grid-template-columns: 1fr; margin-top: 8rem; max-width: 1000px;">
    
    <div class="shop-header">
        <h1 class="shop-title">Shopping Cart</h1>
    </div>

    <div class="shop-main" style="background: var(--bg-surface); border: 1px solid var(--card-border); border-radius: 16px; padding: 2rem;">
        
        <div style="display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 1rem; padding-bottom: 1rem; border-bottom: 1px solid var(--card-border); color: var(--text-secondary); font-weight: 600;">
            <div>Product</div>
            <div>Price</div>
            <div>Quantity</div>
            <div>Total</div>
        </div>

        <!-- Sample Item 1 -->
        <div style="display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 1rem; padding: 1.5rem 0; border-bottom: 1px solid var(--card-border); align-items: center;">
            <div style="display: flex; gap: 1rem; align-items: center;">
                <img src="{% static 'customer_app/img/product/p1.jpg' %}" style="width: 80px; height: 80px; object-fit: contain; background: #111113; border-radius: 8px;">
                <span style="font-weight: 600;">Premium Mechanical Keyboard</span>
            </div>
            <div style="font-weight: 600;">$150.00</div>
            <div>
                <input type="number" value="1" min="1" style="width: 60px; padding: 0.5rem; background: rgba(255,255,255,0.05); border: 1px solid var(--card-border); color: #fff; border-radius: 4px;">
            </div>
            <div style="font-weight: 600; color: var(--accent-color);">$150.00</div>
        </div>

        <!-- Cart Summary -->
        <div style="display: flex; justify-content: flex-end; margin-top: 2rem;">
            <div style="width: 300px; background: rgba(0,0,0,0.2); padding: 1.5rem; border-radius: 12px; border: 1px solid var(--card-border);">
                <div style="display: flex; justify-content: space-between; margin-bottom: 1rem;">
                    <span style="color: var(--text-secondary);">Subtotal</span>
                    <span style="font-weight: 600;">$150.00</span>
                </div>
                <div style="display: flex; justify-content: space-between; margin-bottom: 1rem; border-bottom: 1px solid var(--card-border); padding-bottom: 1rem;">
                    <span style="color: var(--text-secondary);">Shipping</span>
                    <span style="font-weight: 600;">$0.00</span>
                </div>
                <div style="display: flex; justify-content: space-between; margin-bottom: 1.5rem; font-size: 1.2rem;">
                    <span style="font-weight: 700;">Total</span>
                    <span style="font-weight: 700; color: var(--accent-color);">$150.00</span>
                </div>
                <a href="{% url 'checkout' %}" class="btn-premium" style="width: 100%; justify-content: center;">Proceed to Checkout</a>
            </div>
        </div>

    </div>
</div>
{% endblock %}

{% extends "customer_app/base.html" %}
{% load static %}

{% block content %}
<div class="shop-layout" style="grid-template-columns: 1fr; margin-top: 8rem; max-width: 1000px;">
    
    <div class="shop-header">
        <h1 class="shop-title">Shopping Cart</h1>
    </div>

    <div class="shop-main" style="background: var(--bg-surface); border: 1px solid var(--card-border); border-radius: 16px; padding: 4rem; text-align: center;">
        
        <i class="fas fa-shopping-cart" style="font-size: 4rem; color: var(--text-secondary); margin-bottom: 2rem; opacity: 0.5;"></i>
        <h2 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 1rem;">Your cart is empty</h2>
        <p style="color: var(--text-secondary); margin-bottom: 2.5rem;">Looks like you haven't added any gear to your cart yet.</p>
        
        <a href="{% url 'product_list' %}" class="btn-premium" style="display: inline-flex;">Continue Shopping</a>

    </div>
</div>
{% endblock %}

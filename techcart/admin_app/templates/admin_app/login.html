{% extends "customer_app/base.html" %}
{% load static %}

{% block content %}
<div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 8rem 2rem 4rem;">
    
    <div style="background: var(--bg-surface); padding: 3rem; border-radius: 20px; border: 1px solid var(--card-border); max-width: 450px; width: 100%; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);">
        
        <div style="text-align: center; margin-bottom: 2.5rem;">
            <div style="display: inline-block; background: rgba(99,102,241,0.1); color: var(--accent-color); padding: 0.5rem 1rem; border-radius: 50px; font-size: 0.85rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 1rem;"><i class="fas fa-shield-alt"></i> Admin Portal</div>
            <h1 style="font-size: 2rem; font-weight: 800; margin-bottom: 0.5rem; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Admin Sign In</h1>
            <p style="color: var(--text-secondary);">Restricted to authorized administrators.</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div style="margin-bottom: 1.5rem; padding: 1rem; border-radius: 8px; font-size: 0.9rem;
                    {% if message.tags == 'error' %} background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2); color: #f87171;
                    {% else %} background: rgba(34, 197, 94, 0.1); border: 1px solid rgba(34, 197, 94, 0.2); color: #4ade80; {% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form action="{% url 'admin_login' %}" method="POST" style="display: flex; flex-direction: column; gap: 1.5rem;">
            {% csrf_token %}
            
            <div>
                <label style="display: block; color: var(--text-secondary); margin-bottom: 0.5rem; font-size: 0.9rem;">Admin Username</label>
                <input type="text" name="username" placeholder="admin" required style="width: 100%; padding: 1rem; border-radius: 12px; border: 1px solid var(--card-border); background: rgba(255,255,255,0.02); color: white; font-family: inherit;">
            </div>

            <div>
                <label style="display: block; color: var(--text-secondary); margin-bottom: 0.5rem; font-size: 0.9rem;">Password</label>
                <input type="password" name="password" placeholder="••••••••" required style="width: 100%; padding: 1rem; border-radius: 12px; border: 1px solid var(--card-border); background: rgba(255,255,255,0.02); color: white; font-family: inherit;">
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem;">
                <label style="color: var(--text-secondary); display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                    <input type="checkbox" name="remember" style="accent-color: var(--accent-color);"> Keep me logged in
                </label>
            </div>

            <button type="submit" class="btn-premium" style="width: 100%; justify-content: center; padding: 1rem; font-size: 1rem; margin-top: 1rem;">Sign In as Admin</button>
        </form>

        <p style="text-align: center; margin-top: 2rem; color: var(--text-secondary); font-size: 0.95rem;">
            Not an admin? <a href="{% url 'customer_login' %}" style="color: var(--accent-color); font-weight: 600;">Customer Login</a>
        </p>

    </div>
</div>
{% endblock %}

{% extends 'admin_app/base.html' %}
{% load static %}

{% block content %}
<div class="row column_title">
    <div class="col-md-12">
        <div class="page_title">
            <h2>Edit Product: {{ product.name }}</h2>
        </div>
    </div>
</div>
<div class="row">
    <div class="col-md-8 offset-md-2">
        <div class="white_shd full margin_bottom_30">
            <div class="full graph_head">
                <div class="heading1 margin_0"><h2>Product Details</h2></div>
            </div>
            <div class="full padding_infor_info">
                <form method="POST" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="form-group">
                        <label>Product Name</label>
                        <input type="text" name="name" value="{{ product.name }}" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Category</label>
                        <select name="category" class="form-control" required>
                            {% for cat in categories %}
                            <option value="{{ cat.id }}" {% if product.category.id == cat.id %}selected{% endif %}>{{ cat.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label>Price (₹)</label>
                            <input type="number" name="price" value="{{ product.price }}" class="form-control" step="0.01" required>
                        </div>
                        <div class="form-group col-md-6">
                            <label>Stock</label>
                            <input type="number" name="stock" value="{{ product.stock }}" class="form-control" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <textarea name="description" class="form-control" rows="4" required>{{ product.description }}</textarea>
                    </div>
                    <div class="form-group">
                        <label>Product Image</label>
                        {% if product.image %}
                        <div style="margin-bottom: 10px;">
                            <img src="{{ product.image.url }}" alt="{{ product.name }}" style="max-width: 150px; border-radius: 8px;">
                        </div>
                        {% endif %}
                        <input type="file" name="image" class="form-control-file" accept="image/*">
                        <small class="form-text text-muted">Leave empty to keep current image.</small>
                    </div>
                    <button type="submit" class="btn btn-primary">Update Product</button>
                    <a href="{% url 'admin_product_list' %}" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
